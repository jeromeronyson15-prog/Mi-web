<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>CHAT PRO MAX</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:linear-gradient(135deg,#000,#111,#1b1b1b);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:white;
}

/* FONDO */

body::before{
content:"";
position:absolute;
width:200%;
height:200%;
background:
radial-gradient(circle,#00ffcc22 10%,transparent 10%),
radial-gradient(circle,#ff00ff22 10%,transparent 10%);
background-size:120px 120px;
animation:mover 10s linear infinite;
z-index:-1;
}

@keyframes mover{
0%{
transform:translate(0,0);
}
100%{
transform:translate(-120px,-120px);
}
}

/* CONTENEDOR */

#container{
width:95%;
max-width:500px;
height:92vh;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
border:2px solid #00ffcc;
border-radius:20px;
overflow:hidden;
display:flex;
flex-direction:column;
box-shadow:0 0 25px #00ffcc66;
}

/* TOP */

#top{
padding:15px;
text-align:center;
font-size:24px;
font-weight:bold;
background:#00000088;
border-bottom:1px solid #00ffcc;
color:#00ffcc;
text-shadow:0 0 10px #00ffcc;
}

/* LOGIN */

#login{
margin:auto;
display:flex;
flex-direction:column;
gap:15px;
width:80%;
}

#login input{
padding:15px;
border:none;
outline:none;
border-radius:12px;
background:#222;
color:white;
font-size:16px;
}

#login button{
padding:15px;
border:none;
border-radius:12px;
background:#00ffcc;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

#login button:hover{
transform:scale(1.05);
}

/* CHAT */

#chatBox{
display:none;
height:100%;
flex-direction:column;
}

#info{
padding:10px;
background:#111;
color:#00ffcc;
font-size:14px;
border-bottom:1px solid #222;
display:flex;
justify-content:space-between;
}

/* ESCRIBIENDO */

#typing{
padding:8px;
font-size:13px;
color:#00ffcc;
height:30px;
}

/* MENSAJES */

#chat{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

.msg{
background:#222;
padding:12px;
border-radius:15px;
text-align:left;
animation:aparecer 0.2s ease;
word-break:break-word;
box-shadow:0 0 10px #000;
}

@keyframes aparecer{
from{
transform:scale(0.8);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

.nombre{
color:#00ffcc;
font-weight:bold;
margin-bottom:5px;
}

.hora{
font-size:11px;
color:#888;
margin-top:5px;
}

/* ENVIAR */

#enviarBox{
display:flex;
gap:10px;
padding:10px;
background:#111;
}

#texto{
flex:1;
padding:12px;
border:none;
outline:none;
border-radius:12px;
background:#222;
color:white;
font-size:15px;
}

#btnEnviar{
padding:12px 18px;
border:none;
border-radius:12px;
background:#00ffcc;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

#btnEnviar:hover{
transform:scale(1.05);
}

#chat::-webkit-scrollbar{
width:5px;
}

#chat::-webkit-scrollbar-thumb{
background:#00ffcc;
border-radius:10px;
}

</style>
</head>

<body>

<div id="container">

<div id="top">
💬 CHAT DOMI
</div>

<!-- LOGIN -->

<div id="login">

<input id="nombre"
placeholder="Escribe tu nombre">

<button onclick="entrar()">
ENTRAR
</button>

</div>

<!-- CHAT -->

<div id="chatBox">

<div id="info">

<div>
🟢 <span id="online">0</span> en línea
</div>

<div>
👤 <span id="usuarioTexto"></span>
</div>

</div>

<div id="typing"></div>

<div id="chat"></div>

<div id="enviarBox">

<input id="texto"
placeholder="Escribe un mensaje">

<button id="btnEnviar"
onclick="enviar()">
➤
</button>

</div>

</div>

</div>

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>

/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyAlvub4QHml9XJchnE4whDVvOUn-MGsJSA",
  authDomain: "ronysonjero.firebaseapp.com",
  databaseURL: "https://ronysonjero-default-rtdb.firebaseio.com",
  projectId: "ronysonjero",
  storageBucket: "ronysonjero.firebasestorage.app",
  messagingSenderId: "232681593302",
  appId: "1:232681593302:web:3f1736ed0854bd4e0c6c77",
  measurementId: "G-FK4GT53GMH"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let usuario = "";

/* BLOQUEAR CHAT */

document.getElementById("texto").disabled = true;
document.getElementById("btnEnviar").disabled = true;

/* AUTO LOGIN */

window.onload = () => {

let guardado = localStorage.getItem("usuario");

if(guardado){

usuario = guardado;

mostrarChat();

}

}

/* ENTRAR */

function entrar(){

usuario = document.getElementById("nombre").value;

if(usuario == ""){

alert("Escribe tu nombre");

return;

}

localStorage.setItem("usuario",usuario);

mostrarChat();

}

/* MOSTRAR CHAT */

function mostrarChat(){

document.getElementById("login").style.display = "none";

document.getElementById("chatBox").style.display = "flex";

document.getElementById("usuarioTexto").innerText = usuario;

document.getElementById("texto").disabled = false;
document.getElementById("btnEnviar").disabled = false;

/* ONLINE */

let conectado = db.ref("online/" + usuario);

conectado.set(true);

conectado.onDisconnect().remove();

/* LEER ONLINE */

db.ref("online").on("value",(snapshot)=>{

let total = snapshot.numChildren();

document.getElementById("online").innerText = total;

});

/* LEER MENSAJES */

leerMensajes();

/* LEER ESCRIBIENDO */

leerEscribiendo();

}

/* ENVIAR */

function enviar(){

if(usuario == ""){

alert("Debes iniciar sesión");

return;

}

let texto = document.getElementById("texto").value;

if(texto == "") return;

db.ref("chat").push({

usuario: usuario,

texto: texto,

hora: new Date().toLocaleTimeString()

});

document.getElementById("texto").value = "";

/* DEJAR DE ESCRIBIR */

db.ref("escribiendo/" + usuario).remove();

}

/* ENTER */

document.addEventListener("keypress",(e)=>{

if(e.key === "Enter"){

enviar();

}

});

/* MENSAJES */

function leerMensajes(){

db.ref("chat").on("value",(snapshot)=>{

let chat = document.getElementById("chat");

chat.innerHTML = "";

snapshot.forEach((data)=>{

let msg = data.val();

chat.innerHTML += `

<div class="msg">

<div class="nombre">
${msg.usuario}
</div>

<div>
${msg.texto}
</div>

<div class="hora">
${msg.hora}
</div>

</div>

`;

});

chat.scrollTop = chat.scrollHeight;

});

}

/* ESCRIBIENDO */

let timeoutEscribiendo;

document.getElementById("texto")
.addEventListener("input",()=>{

if(usuario == "") return;

db.ref("escribiendo/" + usuario).set(true);

clearTimeout(timeoutEscribiendo);

timeoutEscribiendo = setTimeout(()=>{

db.ref("escribiendo/" + usuario).remove();

},2000);

});

/* LEER ESCRIBIENDO */

function leerEscribiendo(){

db.ref("escribiendo").on("value",(snapshot)=>{

let escribiendo = [];

snapshot.forEach((data)=>{

let nombre = data.key;

if(nombre != usuario){

escribiendo.push(nombre);

}

});

let texto = "";

if(escribiendo.length == 1){

texto = "✍️ " + escribiendo[0] + " está escribiendo...";

}

if(escribiendo.length > 1){

texto = "✍️ Varias personas están escribiendo...";

}

document.getElementById("typing").innerText = texto;

});

}

</script>

</body>
</html>
