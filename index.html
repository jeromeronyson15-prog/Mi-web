<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>💬 GRUPO ONLINE TODOS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
position:fixed;
touch-action:none;
}

body{
background:linear-gradient(135deg,#000,#111,#1b1b1b);
display:flex;
justify-content:center;
align-items:center;
color:white;
}

/* FONDO */

body::before{
content:"";
position:absolute;
width:200%;
height:200%;
background:
radial-gradient(circle,#00ffcc22 10%,transparent 10%),
radial-gradient(circle,#ff00ff22 10%,transparent 10%);
background-size:120px 120px;
animation:mover 10s linear infinite;
z-index:-1;
}

@keyframes mover{
0%{
transform:translate(0,0);
}
100%{
transform:translate(-120px,-120px);
}
}

/* CONTENEDOR */

#container{
width:95%;
max-width:500px;
height:92vh;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
border:2px solid #00ffcc;
border-radius:20px;
overflow:hidden;
display:flex;
flex-direction:column;
box-shadow:0 0 25px #00ffcc66;
}

/* TOP */

#top{
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
font-size:20px;
font-weight:bold;
background:#00000088;
border-bottom:1px solid #00ffcc;
color:#00ffcc;
text-shadow:0 0 10px #00ffcc;
}

#gear{
font-size:24px;
cursor:pointer;
}

/* LOGIN */

#login{
margin:auto;
display:flex;
flex-direction:column;
gap:15px;
width:80%;
}

#login input{
padding:15px;
border:none;
outline:none;
border-radius:12px;
background:#222;
color:white;
font-size:16px;
}

#login button{
padding:15px;
border:none;
border-radius:12px;
background:#00ffcc;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

/* CHAT */

#chatBox{
display:none;
height:100%;
flex-direction:column;
}

#info{
padding:10px;
background:#111;
display:flex;
justify-content:space-between;
font-size:14px;
color:#00ffcc;
}

#typing{
padding:8px;
font-size:13px;
color:#00ffcc;
height:30px;
}

/* MENSAJES */

#chat{
flex:1;
overflow-y:auto;
-webkit-overflow-scrolling:touch;
touch-action:pan-y;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

.msg{
width:92%;
max-width:92%;
padding:14px;
border-radius:18px;
word-break:break-word;
animation:aparecer .2s ease;
box-shadow:0 0 10px #000;
}

/* MIS MENSAJES */

.yo{
align-self:flex-end;
background:#00ffcc;
color:black;
}

/* OTROS */

.otro{
align-self:flex-start;
background:#222;
color:white;
}

.nombre{
font-weight:bold;
margin-bottom:6px;
font-size:15px;
}

.hora{
font-size:11px;
opacity:0.7;
margin-top:6px;
}

@keyframes aparecer{
from{
transform:scale(0.8);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

/* ENVIAR */

#enviarBox{
display:flex;
gap:10px;
padding:10px;
background:#111;
}

#texto{
flex:1;
padding:14px;
border:none;
outline:none;
border-radius:12px;
background:#222;
color:white;
font-size:15px;
}

#btnEnviar{
padding:12px 18px;
border:none;
border-radius:12px;
background:#00ffcc;
font-weight:bold;
cursor:pointer;
}

/* PANEL */

#panel{
position:absolute;
top:70px;
right:15px;
width:250px;
background:#111;
border:1px solid #00ffcc;
border-radius:15px;
padding:15px;
display:none;
z-index:10;
}

#panel button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:#00ffcc;
font-weight:bold;
cursor:pointer;
}

#bloqueados{
margin-top:15px;
max-height:150px;
overflow-y:auto;
}

.userBloqueado{
background:#222;
padding:10px;
border-radius:10px;
margin-top:8px;
display:flex;
justify-content:space-between;
align-items:center;
}

.userBloqueado button{
width:auto;
padding:6px 10px;
font-size:12px;
}

/* SCROLL */

#chat::-webkit-scrollbar{
width:5px;
}

#chat::-webkit-scrollbar-thumb{
background:#00ffcc;
border-radius:10px;
}

</style>
</head>

<body>

<div id="container">

<div id="top">

<div>
💬 GRUPO ONLINE PARA TODOS
</div>

<div id="gear" onclick="abrirPanel()">
⚙️
</div>

</div>

<!-- LOGIN -->

<div id="login">

<input id="nombre"
placeholder="Escribe tu nombre">

<button onclick="entrar()">
ENTRAR
</button>

</div>

<!-- CHAT -->

<div id="chatBox">

<div id="info">

<div>
🟢 <span id="online">0</span> online
</div>

<div>
👤 <span id="usuarioTexto"></span>
</div>

</div>

<div id="typing"></div>

<div id="chat"></div>

<div id="enviarBox">

<input id="texto"
placeholder="Escribe mensaje">

<button id="btnEnviar"
onclick="enviar()">
➤
</button>

</div>

</div>

</div>

<!-- PANEL -->

<div id="panel">

<button onclick="borrarTodo()">
🧹 Borrar chat
</button>

<h3 style="margin-top:15px;">
🚫 Bloqueados
</h3>

<div id="bloqueados"></div>

</div>

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>

/* CONTRASEÑA */

const PASSWORD = "domisix1234";

/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyAlvub4QHml9XJchnE4whDVvOUn-MGsJSA",
  authDomain: "ronysonjero.firebaseapp.com",
  databaseURL: "https://ronysonjero-default-rtdb.firebaseio.com",
  projectId: "ronysonjero",
  storageBucket: "ronysonjero.firebasestorage.app",
  messagingSenderId: "232681593302",
  appId: "1:232681593302:web:3f1736ed0854bd4e0c6c77",
  measurementId: "G-FK4GT53GMH"
};



firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let usuario = "";

/* AUTO LOGIN */

window.onload = ()=>{

let guardado = localStorage.getItem("usuario");

if(guardado){

usuario = guardado;

mostrarChat();

}

}

/* ENTRAR */

function entrar(){

usuario =
document.getElementById("nombre").value;

if(usuario == ""){

alert("Escribe tu nombre");

return;

}

localStorage.setItem("usuario",usuario);

mostrarChat();

}

/* MOSTRAR CHAT */

function mostrarChat(){

document.getElementById("login").style.display="none";

document.getElementById("chatBox").style.display="flex";

document.getElementById("usuarioTexto").innerText=usuario;

/* ONLINE */

let conectado = db.ref("online/" + usuario);

conectado.set(true);

conectado.onDisconnect().remove();

/* ONLINE TOTAL */

db.ref("online").on("value",(snapshot)=>{

document.getElementById("online").innerText =
snapshot.numChildren();

});

leerMensajes();

leerEscribiendo();

leerBloqueados();

}

/* ENVIAR */

function enviar(){

db.ref("bloqueados/" + usuario)
.once("value",(snap)=>{

if(snap.exists()){

alert("Estás bloqueado");

return;

}

let texto =
document.getElementById("texto").value;

if(texto == "") return;

db.ref("chat").push({

usuario:usuario,
texto:texto,
hora:new Date().toLocaleTimeString()

});

document.getElementById("texto").value="";

db.ref("escribiendo/" + usuario).remove();

});

}

/* ENTER */

document.addEventListener("keypress",(e)=>{

if(e.key==="Enter"){

enviar();

}

});

/* LEER MENSAJES */

function leerMensajes(){

db.ref("chat").on("value",(snapshot)=>{

let chat=document.getElementById("chat");

chat.innerHTML="";

snapshot.forEach((data)=>{

let msg=data.val();

let id = data.key;

let clase =
msg.usuario == usuario ? "yo" : "otro";

/* ACCIONES */

let accion = "";

if(msg.usuario == usuario){

accion =
`oncontextmenu="eliminarMensaje('${id}')"
 ontouchstart="mantenerPresionado('${id}')"
 ontouchend="cancelarPresionado()"`;

}else{

accion =
`oncontextmenu="bloquearUsuario('${msg.usuario}')"
 ontouchstart="mantenerBloqueo('${msg.usuario}')"
 ontouchend="cancelarPresionado()"`;

}

chat.innerHTML += `

<div class="msg ${clase}"
${accion}>

<div class="nombre">
${msg.usuario}
</div>

<div>
${msg.texto}
</div>

<div class="hora">
${msg.hora}
</div>

</div>

`;

});

chat.scrollTop = chat.scrollHeight;

});

}

/* ESCRIBIENDO */

let timeout;

document.getElementById("texto")
.addEventListener("input",()=>{

db.ref("escribiendo/" + usuario).set(true);

clearTimeout(timeout);

timeout = setTimeout(()=>{

db.ref("escribiendo/" + usuario).remove();

},2000);

});

/* LEER ESCRIBIENDO */

function leerEscribiendo(){

db.ref("escribiendo").on("value",(snapshot)=>{

let escribiendo=[];

snapshot.forEach((data)=>{

let nombre=data.key;

if(nombre != usuario){

escribiendo.push(nombre);

}

});

let texto="";

if(escribiendo.length==1){

texto="✍️ " + escribiendo[0] +
" está escribiendo...";

}

if(escribiendo.length>1){

texto="✍️ Varias personas están escribiendo...";

}

document.getElementById("typing").innerText=texto;

});

}

/* PANEL */

function abrirPanel(){

let panel=document.getElementById("panel");

panel.style.display =
panel.style.display=="block"
? "none"
: "block";

}

/* BORRAR TODO */

function borrarTodo(){

let pass = prompt("Contraseña admin");

if(pass != PASSWORD){

alert("Contraseña incorrecta");

return;

}

db.ref("chat").remove();

}

/* BLOQUEAR */

function bloquearUsuario(nombre){

if(nombre == usuario) return;

let confirmar =
confirm("¿Bloquear a " + nombre + "?");

if(!confirmar) return;

let pass = prompt("Contraseña admin");

if(pass != PASSWORD){

alert("Contraseña incorrecta");

return;

}

db.ref("bloqueados/" + nombre).set(true);

}

/* LEER BLOQUEADOS */

function leerBloqueados(){

db.ref("bloqueados").on("value",(snapshot)=>{

let lista =
document.getElementById("bloqueados");

lista.innerHTML="";

snapshot.forEach((data)=>{

let nombre = data.key;

lista.innerHTML += `

<div class="userBloqueado">

<div>
${nombre}
</div>

<button onclick="desbloquear('${nombre}')">
✅
</button>

</div>

`;

});

});

}

/* DESBLOQUEAR */

function desbloquear(nombre){

let pass = prompt("Contraseña admin");

if(pass != PASSWORD){

alert("Contraseña incorrecta");

return;

}

db.ref("bloqueados/" + nombre).remove();

}

/* ELIMINAR MENSAJE */

function eliminarMensaje(id){

let confirmar =
confirm("¿Eliminar mensaje?");

if(!confirmar) return;

db.ref("chat/" + id).remove();

}

/* MANTENER PRESIONADO */

let presionado;

function mantenerPresionado(id){

presionado = setTimeout(()=>{

eliminarMensaje(id);

},700);

}

function mantenerBloqueo(nombre){

presionado = setTimeout(()=>{

bloquearUsuario(nombre);

},700);

}

function cancelarPresionado(){

clearTimeout(presionado);

}

</script>

</body>
</html>
