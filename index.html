<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kyzen_Rz</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{
    background:#0d0e12;
    color:#fff;
}

/* LOGIN */
#login-screen{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(13,14,18,.95);
}

.login-box{
    background:#1a1c23;
    padding:30px;
    border-radius:12px;
    width:90%;
    max-width:400px;
    text-align:center;
    border:1px solid #30363d;
}

.login-box h2{
    color:#00adb5;
    margin-bottom:20px;
}

.login-box button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#fff;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

/* MAIN */
#main-content{
    display:none;
    max-width:900px;
    margin:auto;
    padding:20px;
}

.logo{
    text-align:center;
    color:#00adb5;
    font-size:3rem;
    margin:20px 0;
}

/* CARDS */
.media-card{
    background:#1a1c23;
    border:1px solid #30363d;
    border-radius:12px;
    padding:15px;
    margin-bottom:20px;
}

.media-card h3{
    color:#00adb5;
    margin:10px 0;
}

.btn-download{
    display:block;
    text-align:center;
    padding:12px;
    background:#00adb5;
    color:#fff;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}

.media-card iframe{
    width:100%;
    height:220px;
    border-radius:10px;
    margin-top:10px;
}

/* CHAT */
#chat-box{
    height:300px;
    overflow-y:auto;
    background:#0d0e12;
    padding:10px;
    border-radius:8px;
}

.chat-input{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.chat-input input{
    flex:1;
    padding:12px;
    border-radius:6px;
    border:1px solid #30363d;
    background:#0d0e12;
    color:#fff;
}

.chat-input button{
    padding:12px;
    background:#00adb5;
    border:none;
    border-radius:6px;
    color:#fff;
    font-weight:bold;
}

/* ADMIN */
.admin{
    display:flex;
    justify-content:flex-end;
    margin-bottom:10px;
}

.admin button{
    background:red;
    border:none;
    color:#fff;
    padding:10px;
    border-radius:8px;
}
</style>
</head>

<body>
  <div id="login-screen">
    <div class="login-box">

        <h2>Iniciar sesión</h2>

        <button id="googleLogin">
            🔵 Entrar con Google
        </button>

    </div>
</div>

<div id="main-content">

    <h1 class="logo">Kyzen_Rz</h1>

    <!-- ADMIN -->
    <div class="admin">
        <button id="deleteChat">🗑 Borrar Chat</button>
    </div>

    <!-- VIDEOS CON DESCRIPCIÓN -->
    <div class="media-card">
        <a class="btn-download" href="#">Botón 1</a>
        <h3>Descripción del video 1</h3>

        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        allowfullscreen></iframe>
    </div>

    <div class="media-card">
        <a class="btn-download" href="#">Botón 2</a>
        <h3>Descripción del video 2</h3>

        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        allowfullscreen></iframe>
    </div>

    <div class="media-card">
        <a class="btn-download" href="#">Botón 3</a>
        <h3>Descripción del video 3</h3>

        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        allowfullscreen></iframe>
    </div>

    <!-- CHAT -->
    <div class="media-card">

        <h3>Chat de la comunidad</h3>

        <div id="chat-box"></div>

        <div class="chat-input">
            <input type="text" id="msg" placeholder="Escribe...">
            <button id="send">Enviar</button>
        </div>

    </div>

</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
    getFirestore,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    deleteDoc,
    getDocs,
    doc
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyB_DgW2fZ12q3Z4VlbBLEwOZwRbCQAALV4",
  authDomain: "kyzen-rz.firebaseapp.com",
  databaseURL: "https://kyzen-rz-default-rtdb.firebaseio.com",
  projectId: "kyzen-rz",
  storageBucket: "kyzen-rz.firebasestorage.app",
  messagingSenderId: "707659470887",
  appId: "1:707659470887:web:0e08d65bc302fcafc6d602",
  measurementId: "G-1JDG3Q2WYK"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

/* ELEMENTOS */
const loginScreen = document.getElementById("login-screen");
const mainContent = document.getElementById("main-content");
const googleLogin = document.getElementById("googleLogin");

const chatBox = document.getElementById("chat-box");
const msg = document.getElementById("msg");
const send = document.getElementById("send");
const deleteChat = document.getElementById("deleteChat");

let currentUser = "";

/* 🔥 LOGIN GOOGLE */
googleLogin.addEventListener("click", async () => {
    try {
        await signInWithPopup(auth, provider);
    } catch (error) {
        console.error(error);
    }
});

/* 🔥 DETECTAR USUARIO */
onAuthStateChanged(auth, (user) => {

    if (user) {
        currentUser = user.displayName;

        loginScreen.style.display = "none";
        mainContent.style.display = "block";

        loadChat();
    }

});

/* ENVIAR MENSAJE */
send.addEventListener("click", async () => {

    const text = msg.value.trim();
    if (!text) return;

    await addDoc(collection(db, "messages"), {
        user: currentUser,
        text: text,
        time: Date.now()
    });

    msg.value = "";
});

/* CARGAR CHAT */
function loadChat() {

    const q = query(collection(db, "messages"), orderBy("time", "asc"));

    onSnapshot(q, (snap) => {

        chatBox.innerHTML = "";

        snap.forEach(docu => {

            const d = docu.data();

            const div = document.createElement("div");
            div.style.margin = "8px 0";

            div.innerHTML = `
                <b style="color:#00adb5">${d.user}:</b> 
                <span>${d.text}</span>
            `;

            chatBox.appendChild(div);
        });

        chatBox.scrollTop = chatBox.scrollHeight;
    });
}

/* ENTER */
msg.addEventListener("keydown", e => {
    if (e.key === "Enter") send.click();
});

/* BORRAR CHAT */
deleteChat.addEventListener("click", async () => {

    const pass = prompt("Contraseña admin:");

    if (pass !== "1234") {
        alert("Incorrecto");
        return;
    }

    const snap = await getDocs(collection(db, "messages"));

    snap.forEach(async (d) => {
        await deleteDoc(doc(db, "messages", d.id));
    });

    alert("Chat eliminado");
});

</script>
<script>

/* 🔥 LOGIN AUTOMÁTICO NO VOLVER A INICIAR */
let savedUser = localStorage.getItem("user");

if (savedUser) {
    currentUser = savedUser;
    loginScreen.style.display = "none";
    mainContent.style.display = "block";
    loadChat();
}

/* GUARDAR USUARIO */
function saveUser(user) {
    localStorage.setItem("user", user);
}

/* ACTUALIZAR LOGIN DESPUÉS DE GOOGLE */
function setUser(user) {
    currentUser = user;
    saveUser(user);
}

/* BORRAR MENSAJE PROTEGIDO (EXTRA SEGURIDAD SIMPLE) */
function canDelete(pass) {
    return pass === "1234";
}

/* MEJOR VISUAL DE MENSAJES */
function createMessage(data) {

    const div = document.createElement("div");
    div.style.margin = "8px 0";

    const user = document.createElement("b");
    user.style.color = "#00adb5";
    user.textContent = data.user + ": ";

    const text = document.createElement("span");
    text.textContent = data.text;

    div.appendChild(user);
    div.appendChild(text);

    return div;
}

/* REEMPLAZAR RENDER CHAT (MEJORADO) */
function loadChat() {

    const q = query(collection(db, "messages"), orderBy("time", "asc"));

    onSnapshot(q, (snap) => {

        chatBox.innerHTML = "";

        snap.forEach(docu => {

            const data = docu.data();
            chatBox.appendChild(createMessage(data));

        });

        chatBox.scrollTop = chatBox.scrollHeight;
    });
}

/* LIMPIAR CHAT CON SEGURIDAD */
deleteChat.addEventListener("click", async () => {

    const pass = prompt("Contraseña admin:");

    if (!canDelete(pass)) {
        alert("Incorrecto");
        return;
    }

    const snap = await getDocs(collection(db, "messages"));

    snap.forEach(async (d) => {
        await deleteDoc(doc(db, "messages", d.id));
    });

    alert("Chat eliminado correctamente");
});

/* EXPORT GLOBAL */
window.setUser = setUser;

</script>

</body>
    </html>
