<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kyzen_Rz</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{
    background:#0d0e12;
    color:#fff;
}

/* LOGIN */
#login-screen{
    position:fixed;
    inset:0;
    background:rgba(13,14,18,.95);
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:#1a1c23;
    padding:30px;
    border-radius:12px;
    width:90%;
    max-width:400px;
    border:1px solid #30363d;
}

.login-box h2{
    color:#00adb5;
    margin-bottom:15px;
    text-align:center;
}

.login-box input{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border-radius:6px;
    border:1px solid #30363d;
    background:#0d0e12;
    color:#fff;
}

.login-box button{
    width:100%;
    padding:12px;
    border:none;
    background:#00adb5;
    color:#fff;
    font-weight:bold;
    border-radius:6px;
}

/* MAIN */
#main-content{
    display:none;
    max-width:900px;
    margin:auto;
    padding:20px;
}

.logo{
    text-align:center;
    color:#00adb5;
    font-size:3rem;
    margin:20px 0;
}

/* CARDS */
.media-card{
    background:#1a1c23;
    border:1px solid #30363d;
    border-radius:12px;
    padding:15px;
    margin-bottom:20px;
}

.media-card h3{
    color:#00adb5;
    margin:10px 0;
}

.btn-download{
    display:block;
    text-align:center;
    padding:12px;
    background:#00adb5;
    color:#fff;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}

.media-card iframe{
    width:100%;
    height:220px;
    margin-top:10px;
    border-radius:10px;
}

/* CHAT */
#chat-box{
    height:300px;
    overflow-y:auto;
    background:#0d0e12;
    padding:10px;
    border-radius:8px;
}

.chat-input{
    display:flex;
    margin-top:10px;
    gap:10px;
}

.chat-input input{
    flex:1;
    padding:12px;
    border-radius:6px;
    border:1px solid #30363d;
    background:#0d0e12;
    color:#fff;
}

.chat-input button{
    padding:12px;
    background:#00adb5;
    border:none;
    color:#fff;
    border-radius:6px;
    font-weight:bold;
}

/* ADMIN */
.admin{
    display:flex;
    justify-content:flex-end;
    margin-bottom:10px;
}

.admin button{
    background:red;
    border:none;
    color:#fff;
    padding:1px;padding-block: 2px;
    border-radius:3px;
}
</style>
</head>
<body>
  <div id="login-screen">
    <div class="login-box">
        <h2>Kyzen_Rz Login</h2>

        <input type="text" id="username" placeholder="Nombre de usuario">

        <button id="loginBtn">Entrar</button>
    </div>
</div>

<div id="main-content">

    <h1 class="logo">Kyzen_Rz</h1>

    <!-- BOTÓN ADMIN -->
    <div class="admin">
        <button id="deleteChat">X</button>
    </div>

    <!-- VIDEOS + DESCRIPCIÓN + YOUTUBE -->
    <div class="media-card">
        <a class="btn-download" href="https://youtu.be/bKAOGxjmeJo?si=wnMFFgQxLudiIBy5">Botón 1</a>
        <h3>Descripción del video 1</h3>

        <!-- YouTube correcto -->
        <iframe src="http://youtube.com/post/Ugkx5gM67DbLQD51cRnXKh8cUXpGADJt0Lfi?si=vngqrH6mYhM7UATO"
        allowfullscreen></iframe>
    </div>


    <!-- CHAT -->
    <div class="media-card">

        <h3>Chat</h3>

        <div id="chat-box"></div>

        <div class="chat-input">
            <input type="text" id="msg" placeholder="Escribe...">
            <button id="send">Enviar</button>
        </div>

    </div>

</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
    getFirestore,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    deleteDoc,
    getDocs,
    doc
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyB_DgW2fZ12q3Z4VlbBLEwOZwRbCQAALV4",
  authDomain: "kyzen-rz.firebaseapp.com",
  databaseURL: "https://kyzen-rz-default-rtdb.firebaseio.com",
  projectId: "kyzen-rz",
  storageBucket: "kyzen-rz.firebasestorage.app",
  messagingSenderId: "707659470887",
  appId: "1:707659470887:web:0e08d65bc302fcafc6d602",
  measurementId: "G-1JDG3Q2WYK"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ELEMENTOS */
const loginScreen = document.getElementById("login-screen");
const mainContent = document.getElementById("main-content");
const username = document.getElementById("username");
const loginBtn = document.getElementById("loginBtn");

const chatBox = document.getElementById("chat-box");
const msgInput = document.getElementById("msg");
const sendBtn = document.getElementById("send");
const deleteBtn = document.getElementById("deleteChat");

let currentUser = "";

/* 🔥 LOGIN AUTOMÁTICO */
let saved = localStorage.getItem("user");

if (saved) {
    currentUser = saved;
    loginScreen.style.display = "none";
    mainContent.style.display = "block";
    loadChat();
}

/* LOGIN */
loginBtn.addEventListener("click", () => {

    const name = username.value.trim();

    if (!name) return;

    currentUser = name;
    localStorage.setItem("user", name);

    loginScreen.style.display = "none";
    mainContent.style.display = "block";

    loadChat();
});

/* ENVIAR MENSAJE */
sendBtn.addEventListener("click", async () => {

    const text = msgInput.value.trim();
    if (!text) return;

    await addDoc(collection(db, "messages"), {
        user: currentUser,
        text: text,
        time: Date.now()
    });

    msgInput.value = "";
});

/* CARGAR CHAT */
function loadChat() {

    const q = query(collection(db, "messages"), orderBy("time", "asc"));

    onSnapshot(q, (snap) => {

        chatBox.innerHTML = "";

        snap.forEach(docu => {

            const d = docu.data();

            const div = document.createElement("div");
            div.style.margin = "8px 0";

            div.innerHTML = `
                <b style="color:#00adb5">${d.user}:</b> 
                <span>${d.text}</span>
            `;

            chatBox.appendChild(div);
        });

        chatBox.scrollTop = chatBox.scrollHeight;
    });
}

/* ENTER */
msgInput.addEventListener("keydown", e => {
    if (e.key === "Enter") sendBtn.click();
});

/* 🔥 BORRAR CHAT CON CONTRASEÑA */
deleteBtn.addEventListener("click", async () => {

    const pass = prompt("Contraseña de admin:");

    if (pass !== "KEY") {
        alert("Incorrecto");
        return;
    }

    const snap = await getDocs(collection(db, "messages"));

    snap.forEach(async (d) => {
        await deleteDoc(doc(db, "messages", d.id));
    });

    alert("Chat borrado");
});
</script>

</body>
</html>
