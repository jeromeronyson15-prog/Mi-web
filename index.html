<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProChat Nivel Dios ⚡</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --bg-color: #0f172a; /* Modo oscuro pro de fondo */
            --chat-bg: #1e293b; /* Contenedor oscuro elegante */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --message-other: #334155;
            --message-me: var(--primary-gradient);
            --input-bg: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-main);
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 850px;
            background: #111827;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Pantallas */
        .screen {
            display: none;
            height: 100%;
            width: 100%;
            flex-direction: column;
        }

        .screen.active {
            display: flex;
        }

        /* --- LOGIN --- */
        #login-screen {
            justify-content: center;
            align-items: center;
            background: var(--primary-gradient);
        }

        .login-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 85%;
        }

        .login-box h1 { margin-bottom: 10px; font-size: 2.8rem; font-weight: 800; letter-spacing: -1px; }
        .login-box p { margin-bottom: 30px; opacity: 0.9; font-size: 1.05rem; }

        .btn-primary {
            background: white;
            color: #0f172a;
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* --- CHAT HEADER --- */
        .chat-header {
            padding: 20px;
            background: var(--chat-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-info img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--primary); }
        .user-info h2 { font-size: 1.1rem; font-weight: 600; }
        .status { font-size: 0.8rem; color: #10b981; font-weight: 600; display: flex; align-items: center; gap: 4px; }
        .status::before { content: ''; display: inline-block; width: 8px; height: 8px; background: #10b981; border-radius: 50%; }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05); border: none; cursor: pointer; color: var(--text-muted);
            width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, color 0.2s;
        }
        .icon-btn:hover { color: #f43f5e; background: rgba(244, 63, 94, 0.1); }

        /* --- MESSAGES AREA --- */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #0b0f19;
        }

        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .message {
            max-width: 75%;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .message .text {
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.45;
            word-wrap: break-word;
        }

        .message.me { align-self: flex-end; }
        .message.me .text {
            background: var(--message-me);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .message.other { align-self: flex-start; }
        .message.other .text {
            background: var(--message-other);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }

        .message .sender-name {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            margin-left: 8px;
        }
        .message.me .sender-name { display: none; }

        /* --- INPUT AREA --- */
        .chat-input-area {
            padding: 15px 20px;
            background: var(--chat-bg);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        #message-form { display: flex; gap: 12px; align-items: center; }

        #message-input {
            flex: 1;
            padding: 14px 22px;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            outline: none;
            font-size: 0.95rem;
            color: white;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #message-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        .send-btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transition: transform 0.2s, cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .send-btn:hover { transform: scale(1.08); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="login-screen" class="screen active">
            <div class="login-box">
                <h1>ProChat ⚡</h1>
                <p>El chat definitivo en tiempo real</p>
                <button id="login-btn" class="btn-primary">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" width="20">
                    Iniciar con Google
                </button>
            </div>
        </div>

        <div id="chat-screen" class="screen">
            <header class="chat-header">
                <div class="user-info">
                    <img id="user-avatar" src="" alt="Avatar">
                    <div>
                        <h2 id="user-name">Cargando...</h2>
                        <span class="status">Online</span>
                    </div>
                </div>
                <button id="logout-btn" class="icon-btn">
                    <span class="material-symbols-outlined">logout</span>
                </button>
            </header>

            <main id="chat-messages" class="chat-messages"></main>

            <footer class="chat-input-area">
                <form id="message-form">
                    <input type="text" id="message-input" placeholder="Escribe un mensaje pro..." autocomplete="off" required>
                    <button type="submit" class="send-btn">
                        <span class="material-symbols-outlined">send</span>
                    </button>
                </form>
            </footer>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ====================================================================
        // CONFIGURA AQUÍ TUS CREDENCIALES DE FIREBASE
        // ====================================================================
        const firebaseConfig = {
  apiKey: "AIzaSyAlvub4QHml9XJchnE4whDVvOUn-MGsJSA",
  authDomain: "ronysonjero.firebaseapp.com",
  databaseURL: "https://ronysonjero-default-rtdb.firebaseio.com",
  projectId: "ronysonjero",
  storageBucket: "ronysonjero.firebasestorage.app",
  messagingSenderId: "232681593302",
  appId: "1:232681593302:web:3f1736ed0854bd4e0c6c77",
  measurementId: "G-FK4GT53GMH"
};

        // Inicializar
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Nodos del DOM
        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const chatMessages = document.getElementById('chat-messages');
        const userNameEl = document.getElementById('user-name');
        const userAvatarEl = document.getElementById('user-avatar');

        let currentUser = null;
        let unsubscribeMessages = null;

        // Monitorear sesión
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loginScreen.classList.remove('active');
                chatScreen.classList.add('active');
                userNameEl.textContent = currentUser.displayName;
                userAvatarEl.src = currentUser.photoURL;
                loadMessages();
            } else {
                currentUser = null;
                chatScreen.classList.remove('active');
                loginScreen.classList.add('active');
                if (unsubscribeMessages) unsubscribeMessages();
            }
        });

        // Login
        loginBtn.addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Error en login:", error);
                alert("Error al conectar con Google.");
            }
        });

        // Logout
        logoutBtn.addEventListener('click', () => signOut(auth));

        // Enviar mensajes
        messageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            messageInput.value = '';

            try {
                await addDoc(collection(db, "messages"), {
                    text: text,
                    uid: currentUser.uid,
                    displayName: currentUser.displayName,
                    createdAt: serverTimestamp()
                });
            } catch (error) {
                console.error("Error al enviar:", error);
            }
        });

        // Escuchar base de datos en tiempo real
        function loadMessages() {
            const q = query(collection(db, "messages"), orderBy("createdAt", "asc"), limit(70));
            
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                chatMessages.innerHTML = '';
                
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if (!data.createdAt) return;

                    const isMe = data.uid === currentUser.uid;
                    const messageDiv = document.createElement('div');
                    messageDiv.classList.add('message', isMe ? 'me' : 'other');

                    messageDiv.innerHTML = `
                        <div class="sender-name">${data.displayName ? data.displayName.split(' ')[0] : 'Anónimo'}</div>
                        <div class="text">${escapeHTML(data.text)}</div>
                    `;
                    chatMessages.appendChild(messageDiv);
                });
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });
        }

        // Seguridad básica para evitar hackeos por texto (XSS)
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
