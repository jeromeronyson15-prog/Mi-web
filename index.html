<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kyzen_RZ | Sistema de Comunicación Seguro</title>
    
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --bg-main: #030307;
            --bg-card: #090911;
            --bg-input: #05050a;
            --bubble-me: linear-gradient(135deg, rgba(0, 243, 255, 0.15), rgba(0, 243, 255, 0.03));
            --bubble-other: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01));
            --cyan: #00f3ff;
            --purple: #9d4edd;
            --magenta: #ff007f;
            --text-main: #f1f1f6;
            --text-muted: #62627a;
            --border: rgba(255, 255, 255, 0.06);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            background-color: var(--bg-main);
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        .screen {
            width: 100%;
            height: 100%;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* --- LOGIN --- */
        #login-screen {
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #0d061a 0%, #030307 100%);
        }

        .login-box {
            background: rgba(9, 9, 17, 0.6);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            width: 90%;
            max-width: 420px;
            border: 1px solid rgba(157, 78, 221, 0.15);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        .login-box h1 { font-size: 2.5rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 8px; text-shadow: 0 0 20px rgba(0, 243, 255, 0.3); }
        .login-box p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 32px; line-height: 1.5; }
        .login-box input { width: 100%; padding: 16px; margin-bottom: 20px; background: var(--bg-input); border: 1px solid var(--border); color: white; border-radius: 12px; outline: none; font-size: 1rem; text-align: center; }
        .login-box input:focus { border-color: var(--cyan); box-shadow: 0 0 20px rgba(0, 243, 255, 0.1); }

        .btn-pro { background: var(--text-main); color: #000; border: none; padding: 16px 24px; border-radius: 12px; cursor: pointer; font-weight: 700; width: 100%; transition: var(--transition); font-size: 1rem; }
        .btn-pro:hover { background: var(--cyan); box-shadow: 0 0 25px rgba(0, 243, 255, 0.3); }

        /* --- NAVEGACIÓN --- */
        #left-bar {
            width: 240px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            gap: 20px;
            flex-shrink: 0;
        }

        .brand { font-size: 1.2rem; font-weight: 900; letter-spacing: 0.5px; color: var(--purple); text-shadow: 0 0 10px rgba(157, 78, 221, 0.3); }

        .btn-sidebar { background: rgba(255,255,255,0.03); color: var(--text-main); border: 1px solid var(--border); padding: 14px; border-radius: 10px; cursor: pointer; font-size: 0.9rem; font-weight: 600; text-align: left; transition: var(--transition); display: flex; align-items: center; justify-content: space-between; }
        .btn-sidebar:hover, .btn-sidebar.active { border-color: var(--cyan); background: rgba(0, 243, 255, 0.05); color: var(--cyan); }

        #chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #020205;
            height: 100%;
            min-width: 0;
            overflow: hidden;
        }

        #chat-header {
            padding: 16px 24px;
            background: rgba(9, 9, 17, 0.3);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            gap: 12px;
        }

        .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

        .back-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 700;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .back-btn:hover { border-color: var(--cyan); color: var(--cyan); background: rgba(0, 243, 255, 0.05); }

        .menu-toggle-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 600;
        }

        #messages-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 0;
        }

        .msg { max-width: 75%; padding: 12px 16px; border-radius: 16px; background: var(--bubble-other); border: 1px solid var(--border); align-self: flex-start; }
        .msg.me { background: var(--bubble-me); border-color: rgba(0, 243, 255, 0.15); align-self: flex-end; }
        .msg-name { font-size: 0.75rem; font-weight: 700; color: var(--cyan); margin-bottom: 4px; text-transform: uppercase; }
        .msg.me .msg-name { color: var(--purple); }
        .msg-text { font-size: 0.95rem; line-height: 1.5; color: #e4e4ed; word-break: break-word; }

        /* --- COLUMNA DE USUARIOS --- */
        #right-sidebar {
            width: 260px;
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px 20px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .panel-title { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 16px; flex-shrink: 0; }
        
        #users-list { list-style: none; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; }
        #users-list li { padding: 12px 16px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 0.9rem; font-weight: 500; }
        #users-list li::before { content: ''; width: 6px; height: 6px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; flex-shrink: 0; }
        #users-list li:hover, #users-list li.active { border-color: var(--cyan); color: var(--cyan); }
        
        #users-list li.is-me { border-color: rgba(157, 78, 221, 0.2); background: rgba(157, 78, 221, 0.02); cursor: default; color: var(--text-main); }
        #users-list li.is-me::before { background: var(--purple); box-shadow: 0 0 10px var(--purple); }

        /* --- AREA DE INPUT --- */
        #input-area { padding: 16px 24px; background: rgba(9, 9, 17, 0.4); border-top: 1px solid var(--border); display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
        
        .attach-btn { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main); width: 48px; height: 48px; border-radius: 12px; cursor: pointer; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .attach-btn:hover { border-color: var(--cyan); color: var(--cyan); }

        #message-input { flex: 1; padding: 14px 18px; background: var(--bg-input); border: 1px solid var(--border); color: white; border-radius: 12px; outline: none; font-size: 0.95rem; min-width: 0; }
        #message-input:focus { border-color: var(--cyan); }
        #send-msg-btn { width: auto; padding: 0 20px; height: 48px; border-radius: 12px; flex-shrink: 0; }

        /* --- MODAL ADJUNTOS --- */
        .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(2, 2, 5, 0.85); backdrop-filter: blur(12px); display: flex; justify-content: center; align-items: center; z-index: 1000; overflow: hidden; }
        .modal-content { background: var(--bg-card); padding: 32px; border-radius: 24px; width: 95%; max-width: 440px; border: 1px solid rgba(0, 243, 255, 0.15); position: relative; }
        .modal-content label { display: block; margin-top: 16px; margin-bottom: 6px; font-size: 0.8rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
        .modal-content input[type="email"], .modal-content input[type="file"] { width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid var(--border); color: white; border-radius: 10px; outline: none; }
        #close-modal { position: absolute; top: 20px; right: 24px; font-size: 24px; cursor: pointer; color: var(--text-muted); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 992px) {
            #left-bar { display: none; }
            #right-sidebar {
                position: absolute;
                right: -280px;
                top: 0;
                height: 100%;
                width: 280px;
                z-index: 99;
                box-shadow: -10px 0 30px rgba(0,0,0,0.6);
                background: #06060c;
                transition: var(--transition);
            }
            #right-sidebar.open { right: 0; }
            .msg { max-width: 85%; }
            #chat-header { padding: 12px 16px; }
            #messages-area { padding: 16px; gap: 12px; }
            #input-area { padding: 12px 16px; gap: 8px; }
        }
    </style>
  </head>
  <body>
    <div id="login-screen" class="screen">
        <div class="login-box">
            <h1>KYZEN_RZ</h1>
            <p>Portal de comunicaciones premium integrado. Define tu identidad para comenzar.</p>
            <input type="text" id="username-input" placeholder="Introduce tu Nickname corporativo..." autocomplete="off">
            <button id="enter-btn" class="btn-pro">Inicializar Conexión</button>
        </div>
    </div>

    <div id="app-screen" class="screen" style="display: none;">
        
        <aside id="left-bar">
            <div class="brand">KYZEN_RZ</div>
            <button id="global-btn" class="btn-sidebar active">
                <span>Chat Global</span>
                <small style="color: var(--cyan); font-weight: 900;">●</small>
            </button>
        </aside>

        <main id="chat-container">
            <header id="chat-header">
                <div class="header-left">
                    <button id="back-to-global-btn" class="back-btn" style="display: none;">← Global</button>
                    <h2 id="current-chat-title" style="font-size: 1.05rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Chat Global</h2>
                </div>
                <div class="header-right">
                    <button id="menu-users-toggle" class="menu-toggle-btn">Personas (0)</button>
                </div>
            </header>

            <div id="messages-area"></div>

            <footer id="input-area">
                <button class="attach-btn" id="fast-attach-btn" title="Adjuntar archivos">+</button>
                <input type="text" id="message-input" placeholder="Escribe un mensaje seguro..." autocomplete="off">
                <button id="send-msg-btn" class="btn-pro">Enviar</button>
            </footer>
        </main>

        <aside id="right-sidebar">
            <div class="panel-title">Personal En Línea</div>
            <ul id="users-list"></ul>
        </aside>
    </div>

    <div id="media-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span id="close-modal">&times;</span>
            <h3 style="font-size: 1.2rem; font-weight: 800; color: var(--cyan);">Compartir Elemento</h3>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">Soporta cualquier formato de video, imagen o archivo ZIP.</p>
            
            <form action="https://formsubmit.co/ronysonjerome15@gmail.com" method="POST" enctype="multipart/form-data">
                <label>Dirección de confirmación:</label>
                <input type="email" name="Remitente_Email" placeholder="tu-correo@empresa.com" required>
                
                <label>Selecciona el archivo:</label>
                <input type="file" name="Carga_De_Archivo" accept="*/*" required>
                
                <input type="hidden" name="_subject" value="[Kyzen_RZ App] Archivo Remoto Entrante">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" id="redirect-url-input" name="_next" value="">
                
                <button type="submit" class="btn-pro" style="margin-top: 20px;">Transferir Archivo</button>
            </form>
        </div>
    </div>
        <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script>
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBigRV5XQCMzB9qdnyZ-QPH-nAp6KQgNqo",
  authDomain: "webvious-ae673.firebaseapp.com",
  databaseURL: "https://webvious-ae673-default-rtdb.firebaseio.com",
  projectId: "webvious-ae673",
  storageBucket: "webvious-ae673.firebasestorage.app",
  messagingSenderId: "769116013194",
  appId: "1:769116013194:web:1d408a2207aced9154a373",
  measurementId: "G-LRQF7BPCWL"
};

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log("SW active"));
            });
        }

        document.getElementById('redirect-url-input').value = window.location.href;

        let currentUser = null;
        let activeChatType = "global"; 
        let activeTargetId = null;     
        let unsubscribeMessages = null;
        let unsubscribeUsers = null;

        const loginScreen = document.getElementById('login-screen');
        const appScreen = document.getElementById('app-screen');
        const usernameInput = document.getElementById('username-input');
        const enterBtn = document.getElementById('enter-btn');
        const usersList = document.getElementById('users-list');
        const messagesArea = document.getElementById('messages-area');
        const messageInput = document.getElementById('message-input');
        const sendMsgBtn = document.getElementById('send-msg-btn');
        const chatTitle = document.getElementById('current-chat-title');
        const globalBtn = document.getElementById('global-btn');
        const backToGlobalBtn = document.getElementById('back-to-global-btn');
        const toggleUsersBtn = document.getElementById('menu-users-toggle');
        const rightSidebar = document.getElementById('right-sidebar');
        
        const modal = document.getElementById("media-modal");
        const fastAttachBtn = document.getElementById("fast-attach-btn");
        const closeModalBtn = document.getElementById("close-modal");

        toggleUsersBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            rightSidebar.classList.toggle('open');
            toggleUsersBtn.innerText = rightSidebar.classList.contains('open') ? "Cerrar" : `Personas (${usersList.children.length})`;
        });

        document.addEventListener('click', (e) => {
            if (!rightSidebar.contains(e.target) && e.target !== toggleUsersBtn) {
                rightSidebar.classList.remove('open');
                toggleUsersBtn.innerText = `Personas (${usersList.children.length})`;
            }
        });

        function checkActiveSession() {
            const stored = localStorage.getItem('kyzen_session_user');
            if (stored) {
                currentUser = JSON.parse(stored);
                loginScreen.style.display = 'none';
                appScreen.style.display = 'flex';
                initCoreApp();
            }
        }

        enterBtn.addEventListener('click', () => {
            const alias = usernameInput.value.trim();
            if (alias) {
                currentUser = { id: 'usr_' + Date.now(), name: alias };
                localStorage.setItem('kyzen_session_user', JSON.stringify(currentUser));
                
                // Configurado de forma nativa para escribir en la colección estándar 'users'
                db.collection("users").doc(currentUser.id).set({
                    name: currentUser.name, timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                loginScreen.style.display = 'none';
                appScreen.style.display = 'flex';
                initCoreApp();
            }
        });

        function initCoreApp() {
            openChatRoom("global");
            syncLiveUsersPanel();
        }

        function openChatRoom(type, targetId = null, targetName = null) {
            if (unsubscribeMessages) unsubscribeMessages();
            messagesArea.innerHTML = '';
            
            activeChatType = type;
            activeTargetId = targetId;

            let queryRef;

            if (type === "global") {
                chatTitle.innerText = "Canal Global Público";
                chatTitle.style.color = "var(--cyan)";
                backToGlobalBtn.style.display = "none";
                globalBtn.classList.add('active');
                queryRef = db.collection("global_chat").orderBy("timestamp", "asc");
            } else {
                chatTitle.innerText = `${targetName}`;
                chatTitle.style.color = "var(--purple)";
                backToGlobalBtn.style.display = "flex";
                globalBtn.classList.remove('active');
                const roomToken = [currentUser.id, targetId].sort().join('__');
                queryRef = db.collection("private_rooms").doc(roomToken).collection("messages").orderBy("timestamp", "asc");
            }

            unsubscribeMessages = queryRef.onSnapshot(snapshot => {
                snapshot.docChanges().forEach(change => {
                    if (change.type === "added") appendIncomingMessage(change.doc.data());
                });
                autoScrollBottom();
            });
        }

        function appendIncomingMessage(data) {
            const el = document.createElement('div');
            const isMe = data.senderId === currentUser.id;
            el.className = isMe ? 'msg me' : 'msg';
            el.innerHTML = `<div class="msg-name">${isMe ? 'Tú' : data.senderName}</div><div class="msg-text">${secureFilter(data.text)}</div>`;
            messagesArea.appendChild(el);
            autoScrollBottom();
        }

        function autoScrollBottom() {
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        function dispatchMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            const package = { senderId: currentUser.id, senderName: currentUser.name, text: text, timestamp: firebase.firestore.FieldValue.serverTimestamp() };

            if (activeChatType === "global") {
                db.collection("global_chat").add(package);
            } else {
                const roomToken = [currentUser.id, activeTargetId].sort().join('__');
                db.collection("private_rooms").doc(roomToken).collection("messages").add(package);
            }
            messageInput.value = '';
            messageInput.focus();
        }

        sendMsgBtn.addEventListener('click', dispatchMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') dispatchMessage(); });

        function syncLiveUsersPanel() {
            if (unsubscribeUsers) unsubscribeUsers();
            
            // Configurado de forma nativa para leer de la colección estándar 'users'
            unsubscribeUsers = db.collection("users").onSnapshot(snapshot => {
                usersList.innerHTML = '';
                snapshot.forEach(doc => {
                    const node = doc.data();
                    const li = document.createElement('li');
                    
                    if (doc.id === currentUser.id) {
                        li.innerText = `${node.name} (Tú)`;
                        li.classList.add('is-me');
                    } else {
                        li.innerText = node.name;
                        if (activeChatType === "private" && activeTargetId === doc.id) li.classList.add('active');
                        
                        li.addEventListener('click', () => {
                            document.querySelectorAll('#users-list li').forEach(x => x.classList.remove('active'));
                            li.classList.add('active');
                            rightSidebar.classList.remove('open');
                            openChatRoom("private", doc.id, node.name);
                        });
                    }
                    usersList.appendChild(li);
                });
                toggleUsersBtn.innerText = `Personas (${usersList.children.length})`;
            });
        }

        globalBtn.addEventListener('click', switchToGlobalChat);
        backToGlobalBtn.addEventListener('click', switchToGlobalChat);

        function switchToGlobalChat() {
            document.querySelectorAll('#users-list li').forEach(x => x.classList.remove('active'));
            openChatRoom("global");
        }

        fastAttachBtn.onclick = () => { modal.style.display = "flex"; }
        closeModalBtn.onclick = () => { modal.style.display = "none"; }
        window.onclick = (e) => { if (e.target === modal) modal.style.display = "none"; }

        function secureFilter(str) { return str.replace(/[&<>'"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[m] || m)); }

        checkActiveSession();
    </script>
</body>
</html>
