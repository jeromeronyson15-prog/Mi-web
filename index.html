<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Web Gamer</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f0f0f,#1a1a1a);
    color:white;
    text-align:center;
    min-height:100vh;
}

header{
    background:#111;
    padding:20px;
    border-bottom:2px solid #00ff88;
}

h1{
    color:#00ff88;
}

.container{
    padding:20px;
}

.card{
    max-width:400px;
    margin:20px auto;
    background:#1c1c1c;
    border-radius:15px;
    padding:20px;
    box-shadow:0 0 15px rgba(0,255,136,.3);
}

button{
    background:#00ff88;
    color:black;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin:5px;
}

button:hover{
    opacity:.9;
}

#perfil{
    display:none;
}

#foto{
    width:120px;
    height:120px;
    border-radius:50%;
    border:3px solid #00ff88;
    margin-bottom:10px;
}

.stats{
    margin-top:15px;
}

.stats p{
    margin:8px 0;
}
</style>
</head>
<body>

<header>
    <h1>🎮 MI WEB GAMER 🎮</h1>
</header>

<div class="container">

    <div class="card">

        <button id="loginBtn">
            Iniciar sesión con Google
        </button>

        <div id="perfil">

            <img id="foto" src="" alt="Foto">

            <h2 id="nombre"></h2>

            <p id="correo"></p>

            <div class="stats">
                <p>🏆 Nivel: 1</p>
                <p>💰 Monedas: 0</p>
                <p>⭐ Experiencia: 0 XP</p>
            </div>

            <button onclick="alert('Inventario próximamente')">
                🎒 Inventario
            </button>

            <button onclick="alert('Tienda próximamente')">
                🛒 Tienda
            </button>

        </div>

    </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* PEGA AQUÍ TU firebaseConfig */
const firebaseConfig = {
apiKey: "AIzaSyDj6iZHU2HoarsVxgVhHgQpR9zCLs2_DDU",
authDomain: "tokiti-50178.firebaseapp.com",
databaseURL: "https://tokiti-50178-default-rtdb.firebaseio.com",
projectId: "tokiti-50178",
storageBucket: "tokiti-50178.firebasestorage.app",
messagingSenderId: "390503823109",
appId: "1:390503823109:web:6f90a7fc6a986ccd4d296c",
measurementId: "G-PFDR68JQF5"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("loginBtn").addEventListener("click", async () => {

    try {

        const provider = new GoogleAuthProvider();

        const result = await signInWithPopup(auth, provider);

        document.getElementById("perfil").style.display = "block";

        document.getElementById("foto").src =
            result.user.photoURL;

        document.getElementById("nombre").innerText =
            result.user.displayName;

        document.getElementById("correo").innerText =
            result.user.email;

        document.getElementById("loginBtn").style.display =
            "none";

    } catch(error) {

        alert("Error: " + error.message);

    }

});

</script>

</body>
</html>
